plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'checkstyle'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

checkstyle {
    toolVersion = '9.3' // or the version you are using
    // configFile = file("${project.rootDir}/checkstyle.xml") // path to your Checkstyle config file
    configFile = file("checkstyle.xml") // path to your Checkstyle config file

}
dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
    checkstyle "com.puppycrawl.tools:checkstyle:9.3" // Use a valid version

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:31.1-jre'
}

application {
    // Define the main class for the application.
    mainClass = 'testunitario.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

test {
    testLogging {
        events "passed", "skipped", "failed"

        // Possible values: QUIET, MINIMAL, NORMAL, VERBOSE
        outputs.upToDateWhen { false }
        showExceptions true
        showCauses true
        showStackTraces true
    }
}
